[workspace]
resolver = "3"
members = ["crates/*"]

# Values shared by every crate in the workspace. Each crate opts in with
# `version.workspace = true` etc. in its own Cargo.toml.
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["qviperh <olteanromeodavid34@gmail.com>"]
license = "MIT"
repository = "https://github.com/viperh/tachy"
rust-version = "1.90"

# Central dependency versions. Crates reference these with
# `some-dep = { workspace = true }` so versions stay in lockstep.
[workspace.dependencies]
# --- internal ---
tachy-core = { path = "crates/tachy-core" }

# --- tui / terminal ---
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
ratatui = { version = "0.30.2", features = ["serde", "macros"] }
signal-hook = "0.4.4"

# --- async runtime ---
# `tokio` has no default features; each crate opts into the ones it needs
# (`tachy` uses "full", `tachy-core` only the non-UI subset, README §A2).
futures = "0.3.32"
tokio = { version = "1.52.3", default-features = false }
tokio-util = "0.7.18"

# --- data processing (tachy-core) ---
csv-core = "0.1.13"
encoding_rs = "0.8.42"
memchr = "2.8.3"
memmap2 = "0.9.11"
regex = "1.13.1"
roaring = "0.11.5"
smallvec = "1.16.0"
tempfile = "3.27.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# --- ui helpers (tachy) ---
globset = "0.4.20"
nucleo-matcher = "0.3.1"

# --- cli / config ---
clap = { version = "4.6.1", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
config = "0.15.25"
directories = "6.0.0"
json5 = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }

# --- errors / diagnostics ---
better-panic = "0.3.0"
color-eyre = "0.6.5"
human-panic = "2.0.8"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0.17"

# --- logging ---
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"] }

# --- misc ---
libc = "0.2.186"
strum = { version = "0.28.0", features = ["derive"] }

# --- build scripts ---
anyhow = "1.0.103"
vergen-gix = { version = "10.0.1", features = ["build", "cargo"] }

# --- dev ---
# rayon is off: the project does not use it (README §A2). criterion pulls in
# clap as a dev-only dependency; `tachy-core` normal deps stay clap-free.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }
insta = { version = "1.49.0", features = ["yaml"] }
# Independent reference CSV parser for export round-trip tests (M6-01).
csv = "1.4.0"
pretty_assertions = "1.4.1"
proptest = "1.11.0"
# Pseudo-terminal end-to-end tests of the binary (`crates/tachy/tests/pty.rs`),
# and a terminal emulator to read back the screen.
portable-pty = "0.9.0"
vt100 = "0.16.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
# Full optimisation (not "s"): the §17 throughput targets depend on it.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Benchmarks: release settings, but keep symbols so flamegraphs stay readable.
[profile.bench]
inherits = "release"
debug = true
strip = false

# Optimise dependencies (csv-core, memchr, regex, roaring, ...) even in debug
# builds so large files stay usable while developing.
[profile.dev.package."*"]
opt-level = 2
